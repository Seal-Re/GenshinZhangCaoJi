[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuanshen-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "opencv-python>=4.9.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.26.0",
    "aiofiles>=23.0.0",
    "apscheduler>=3.10.0",
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["yuanshen_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
